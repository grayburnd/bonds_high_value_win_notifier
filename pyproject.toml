[project]
name = "bonds_high_value_win_notifier" ##Allows pip install bonds_high_value_win_notifier
description = "A tool to automate downloading NS&I Premium Bonds High Value winners sheets, filter for potential matches based on provided environment variables and notifies via email regarding any potential matching wins"
version = "0.1.0"
requires-python = ">=3.14,<4"
readme = "README.md"
maintainers = [
    { name = "Daniel Grayburn", email = "grayburndan@gmail.com" }
]
dependencies = [
    "openpyxl~=3.1",
    "pandas~=3.0",
    "python-json-logger~=4.1",
    "pyyaml~=6.0",
    "requests~=2.34",
    "six~=1.17",
]

[dependency-groups]
dev = [
    "bandit~=1.9",
    "black~=26.5",
    "cfgv~=3.5.0",
    "distlib~=0.4.3",
    "filelock~=3.32.2",
    "identify~=2.6.19",
    "isort~=8.0",
    "mypy~=2.3",
    "nodeenv~=1.10.0",
    "pandas-stubs~=3.0",
    "pre-commit~=4.6.1",
    "pytest~=9.1",
    "python-discovery~=1.5.1",
    "ruff~=0.16",
    "types-pyyaml~=6.0",
    "virtualenv~=21.7.0",
]

[tool.pytest.ini_options]
addopts = "-rA -s -v"
markers = [
    "unit: quick unit tests",
    "resilience: tests resilience of retry logic"
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 80

[tool.black]
line-length = 80

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
warn_no_return = false

[tool.bandit]
exclude_dirs = [".venv", "__pycache__"]

[tool.isort]
profile = "black"
line_length = 80
