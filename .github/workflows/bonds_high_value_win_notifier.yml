name: bonds_high_value_win_notifier
# run-name: ${{ github.actor }} is learning GitHub Actions
on: workflow_dispatch
env:
  python-version: 3.14
jobs:
  build_execute:
    runs-on: ubuntu-latest
    outputs:
      results_path: ${{ steps.run_python.outputs.RESULTS_PATH }}
      message: ${{ steps.run_python.outputs.MESSAGE }}
      create_artifact: ${{ steps.run_python.outputs.CREATE_ARTIFACT }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ env.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.python-version }}
      # You can test your matrix by printing the current Python version
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Python
        id: run_python
        env:
          PB_VAL_OF_BOND: ${{ vars.PB_VAL_OF_BOND }}
          PB_DATE_OF_PURCHASE: ${{ vars.PB_DATE_OF_PURCHASE }}
          PB_AREA: ${{ vars.PB_AREA }}
        run: python main.py
      - name: Upload Results Artifact
        if: ${{ steps.run_python.outputs.CREATE_ARTIFACT == 'True' }}
        uses: actions/upload-artifact@v7
        with:
          name: winnings-results
          path: ${{ steps.run_python.outputs.RESULTS_PATH }}

  notify_if_win:
    needs: build_execute
    runs-on: ubuntu-latest
    env:
      message: ${{ needs.build_execute.outputs.message }}
      results_path: ${{ needs.build_execute.outputs.results_path }}
      create_artifact: ${{ needs.build_execute.outputs.create_artifact }}
    steps:
      - uses: actions/download-artifact@v7
        if: ${{ env.create_artifact == 'True' }}
        with:
          name: winnings-results
      - name: Send mail
        uses: dawidd6/action-send-mail@v18
        with:
          # MailerSend Server Specifications
          server_address: ${{ vars.MAIL_ADDRESS }}
          server_port: 587
          
          # Authentication fetched securely from Actions Secrets
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          
          # Email Routing Information
          subject: "Premium Bonds: High Value Winnings Filter Results"
          to: ${{ vars.MAIL_TO }} 
          
          from: ${{ vars.MAIL_FROM }}

          attachments: ${{ env.results_path || '[]' }}
          
          body: |
           The results are in from this months Premium bonds high value earnings results!!

           ${{ env.message }}